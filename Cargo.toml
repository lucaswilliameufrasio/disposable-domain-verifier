[package]
name = "disposable-domain-verifier"
version = "1.0.0"
edition = "2024"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
tracing-subscriber = "0.3.23"
tracing = "0.1.44"
tower-http = { version = "0.7.1", features = ["trace"] }
ahash = "0.8"
arc-swap = "1.9"
mimalloc = "0.1"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls"], optional = true }
sha2 = { version = "0.11.1", optional = true }
tempfile = { version = "3", optional = true }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
criterion = { version = "0.8.2", features = ["async_tokio"] }

[[bench]]
name = "verify_lookup"
harness = false

[features]
blocklist-updater = ["dep:reqwest", "dep:sha2", "dep:tempfile"]

[[bin]]
name = "update-blocklist"
path = "src/bin/update_blocklist.rs"
required-features = ["blocklist-updater"]
