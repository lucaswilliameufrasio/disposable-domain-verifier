name: Blocklist updater artifact trial

on:
  pull_request:
    paths:
      - .github/workflows/updater-artifact-trial.yml
      - src/bin/update_blocklist.rs
      - Cargo.toml
      - Cargo.lock
      - scripts/**

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
      binary-sha256: ${{ steps.package.outputs.binary-sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master @ 2026-11-15
        with:
          toolchain: 1.100.0
      - name: Build and package the pinned source
        id: package
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          cargo build --locked --release --features blocklist-updater --bin update-blocklist
          mkdir "$RUNNER_TEMP/updater"
          cp target/release/update-blocklist "$RUNNER_TEMP/updater/"
          cd "$RUNNER_TEMP/updater"
          printf '%s\n' "$GITHUB_SHA" > source-sha
          digest=$(sha256sum update-blocklist)
          printf 'binary-sha256=%s\n' "${digest%% *}" >> "$GITHUB_OUTPUT"
      - name: Upload same-run test artifact
        id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: updater-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/updater/
          if-no-files-found: error
          retention-days: 3

  compare:
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download exact artifact from this run
        id: download
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.package.outputs.artifact-id }}
          digest-mismatch: error
          path: ${{ runner.temp }}/prebuilt
      - name: Verify artifact and measure prebuilt updater against Python
        env:
          BINARY_SHA256: ${{ needs.package.outputs.binary-sha256 }}
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(cat "$RUNNER_TEMP/prebuilt/source-sha")" = "$GITHUB_SHA"
          printf '%s  %s\n' "$BINARY_SHA256" "$RUNNER_TEMP/prebuilt/update-blocklist" | sha256sum --check --strict
          chmod +x "$RUNNER_TEMP/prebuilt/update-blocklist"
          PYTHONDONTWRITEBYTECODE=1 python3 - <<'PY'
          import hashlib
          import os
          from pathlib import Path
          import shutil
          import statistics
          import subprocess
          import sys
          import tempfile
          import time

          root = Path.cwd()
          binary = Path(os.environ["RUNNER_TEMP"]) / "prebuilt" / "update-blocklist"
          samples = {"Python": [], "Rust prebuilt": []}
          hashes = set()
          with tempfile.TemporaryDirectory() as directory:
              candidate = Path(directory)
              (candidate / "scripts").mkdir()
              updater = candidate / "scripts" / "update_blocklist.py"
              shutil.copy2(root / "scripts" / updater.name, updater)
              shutil.copytree(root / "assets", candidate / "assets")
              commands = {
                  "Python": [sys.executable, str(updater)],
                  "Rust prebuilt": [str(binary), "--root", str(candidate)],
              }
              for order in (tuple(commands), tuple(reversed(commands)), tuple(commands)):
                  for name in order:
                      target = candidate / "assets" / "blocklist.txt"
                      shutil.copy2(root / "assets" / target.name, target)
                      start = time.monotonic()
                      subprocess.run(commands[name], check=True, timeout=150)
                      elapsed = time.monotonic() - start
                      samples[name].append(elapsed)
                      digest = hashlib.sha256(target.read_bytes()).hexdigest()
                      hashes.add(digest)
                      print(f"{name}: {elapsed:.3f}s, sha256={digest}", flush=True)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              print("### Updater command timings (excludes artifact transfer and shared CI)", file=summary)
              for name, values in samples.items():
                  print(f"- {name}: median {statistics.median(values):.3f}s; n={len(values)}", file=summary)
              print(f"- Distinct output hashes: {len(hashes)}", file=summary)
          if len(hashes) != 1:
              raise SystemExit("Outputs differed; inspect upstream snapshot hashes before interpreting timing.")
          PY
