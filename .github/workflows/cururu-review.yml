name: Cururu PR Review

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Pull request number to review"
        required: true
        type: string

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: cururu-${{ github.event.pull_request.number || github.event.workflow_run.pull_requests[0].number || github.event.issue.number || inputs.pr_number }}
  cancel-in-progress: true

jobs:
  review:
    if: >-
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.pull_requests[0].number) ||
      github.event_name == 'issue_comment' ||
      github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      pull-requests: write
      issues: write
      checks: read
    runs-on: ubuntu-latest
    steps:
      - name: Check LLM API key
        id: llm_key
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
        run: |
          if [ -z "$LLM_API_KEY" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::LLM_API_KEY is not configured — skipping Cururu review."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Review PR
        if: steps.llm_key.outputs.skip == 'false'
        uses: lucaswilliameufrasio/cururu@0a9ecbfe978963a82086f5690b5f84b40c77738c # v4.6.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          llm_api_key: ${{ secrets.LLM_API_KEY }}
          pr_number: ${{ github.event.workflow_run.pull_requests[0].number || github.event.issue.number || inputs.pr_number }}

  blocklist-safety:
    if: github.event_name == 'pull_request_target' && github.event.pull_request.draft == false
    permissions:
      contents: read
      pull-requests: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - name: Validate blocklist diff without executing PR code
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import os
          import re
          import subprocess
          from pathlib import Path

          diff = subprocess.run(
              ["gh", "pr", "diff", os.environ["PR_NUMBER"], "--repo", os.environ["REPOSITORY"]],
              check=True, capture_output=True, text=True,
          ).stdout
          blocklist_additions = set()
          protected_additions = set()
          protected_deletions = set()
          current_file = None
          for line in diff.splitlines():
              if line.startswith("diff --git "):
                  current_file = line.split(" b/", 1)[1]
              elif line.startswith(("+++", "---")):
                  continue
              elif line.startswith("+") or line.startswith("-"):
                  value = line[1:].strip().lower()
                  if not value or value.startswith("#"):
                      continue
                  if current_file == "assets/blocklist.txt" and line.startswith("+"):
                      blocklist_additions.add(value)
                  elif current_file == "assets/legitimate-domains.txt":
                      if line.startswith("+"):
                          protected_additions.add(value)
                      else:
                          protected_deletions.add(value)

          def valid_domain(domain):
              if len(domain) > 253:
                  return False
              labels = domain.split(".")
              return len(labels) >= 2 and all(
                  0 < len(label) <= 63
                  and not label.startswith("-")
                  and not label.endswith("-")
                  and re.fullmatch(r"[a-z0-9-]+", label)
                  for label in labels
              )

          protected_path = Path("assets/legitimate-domains.txt")
          base_protected = {
              line.strip().lower()
              for line in (protected_path.read_text().splitlines() if protected_path.exists() else [])
              if line.strip() and not line.lstrip().startswith("#")
          }
          removed_protected = sorted(base_protected & protected_deletions)
          invalid_additions = sorted(domain for domain in blocklist_additions if not valid_domain(domain))
          protected_hits = sorted(blocklist_additions & (base_protected | protected_additions))
          if removed_protected or invalid_additions or protected_hits:
              if removed_protected:
                  print("Protected domains cannot be removed: " + ", ".join(removed_protected))
              if invalid_additions:
                  print("Malformed domains added to blocklist: " + ", ".join(invalid_additions))
              if protected_hits:
                  print("Legitimate domains added to blocklist: " + ", ".join(protected_hits))
              raise SystemExit(1)
          print(f"Validated {len(blocklist_additions)} blocklist additions against {len(base_protected)} trusted protections.")
          PY
