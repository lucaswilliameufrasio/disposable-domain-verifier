name: Update Disposable Domains Blocklist

on:
  schedule:
    - cron: '0 0 * * *' # Run daily at midnight UTC
  workflow_dispatch: # Allow manual trigger

jobs:
  update-blocklist:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run update script
        run: |
          chmod +x scripts/update_blocklist.sh
          ./scripts/update_blocklist.sh

      - name: Install Rust
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master @ 2026-09-22
        with:
          toolchain: 1.98.1

      - name: Cache cargo
        uses: Swatinem/rust-cache@63fed3e2fecf6f7b51dc6f043341b79ef82a9ae7 # v2.9.2

      - name: Test (validates updated blocklist loads)
        run: cargo test

      - name: Create Pull Request
        id: create_pr
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore(assets): update disposable domains blocklist"
          title: "chore: update disposable domains blocklist"
          body: |
            Automated update of the disposable domains blocklist.
            
            This PR updates `assets/blocklist.txt` with the latest data from the upstream source.
            Sanity checks (file size, presence of common domains like gmail.com, etc.) were performed before updating.
          branch: "automation/update-blocklist"
          base: "main"
          delete-branch: true
          labels: |
            automated-pr
            dependencies

      - name: Trigger Cururu review
        if: steps.create_pr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.create_pr.outputs.pull-request-number }}
        run: gh workflow run cururu-review.yml --ref main --field pr_number="$PR_NUMBER"
