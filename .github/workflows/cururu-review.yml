name: Cururu PR Review

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Pull request number to review"
        required: true
        type: string

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: cururu-${{ github.event.pull_request.number || github.event.workflow_run.pull_requests[0].number || github.event.issue.number || inputs.pr_number }}
  cancel-in-progress: true

jobs:
  review:
    if: >-
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.pull_requests[0].number &&
       github.event.workflow_run.head_branch != 'automation/update-blocklist') ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request != null) ||
      github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      pull-requests: write
      issues: write
      checks: read
    runs-on: ubuntu-latest
    steps:
      - name: Check LLM API key
        id: llm_key
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
        run: |
          if [ -z "$LLM_API_KEY" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::LLM_API_KEY is not configured — skipping Cururu review."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Verify PR is ready and matches the successful CI run
        id: head_check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number || github.event.issue.number || inputs.pr_number }}
          EXPECTED_HEAD_SHA: ${{ github.event.workflow_run.pull_requests[0].head.sha }}
          WORKFLOW_EVENT: ${{ github.event_name }}
          CI_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        run: |
          if ! pr=$(timeout 30s gh api "repos/$REPOSITORY/pulls/$PR_NUMBER"); then
            echo "::error::Could not read PR metadata from GitHub within 30 seconds."
            exit 1
          fi
          current_head=$(jq -r .head.sha <<< "$pr")
          is_draft=$(jq -r .draft <<< "$pr")
          echo "head_sha=$current_head" >> "$GITHUB_OUTPUT"
          if [ "$is_draft" = "true" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Cururu skips draft PRs until they are marked ready for review."
          elif [ -n "$EXPECTED_HEAD_SHA" ] && [ "$current_head" != "$EXPECTED_HEAD_SHA" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::PR head changed after CI; skipping review of an unvalidated revision."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Prepare trusted Cururu analysis manifest
        if: steps.llm_key.outputs.skip == 'false' && steps.head_check.outputs.skip != 'true'
        env:
          HEAD_SHA: ${{ steps.head_check.outputs.head_sha }}
          WORKFLOW_EVENT: ${{ github.event_name }}
          CI_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        run: |
          mkdir -p artifacts
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          if os.environ["WORKFLOW_EVENT"] == "workflow_run" and os.environ["CI_CONCLUSION"] == "success":
              status = "passed"
              message = "The required CI workflow passed for this pull request revision."
          else:
              status = "not_run"
              message = "This was a manually requested Cururu review, not a CI completion event."

          manifest = {
              "schema_version": 1,
              "commit_sha": os.environ["HEAD_SHA"],
              "tools": [{"name": "CI", "status": status, "exit_code": 0, "message": message}],
          }
          Path("artifacts/analysis.json").write_text(json.dumps(manifest, indent=2) + "\n")
          PY
      - name: Review PR
        id: cururu_review
        if: steps.llm_key.outputs.skip == 'false' && steps.head_check.outputs.skip != 'true'
        uses: lucaswilliameufrasio/cururu@9a546f7242706bfe8a1644a14914998af092c622 # v4.9.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          llm_api_key: ${{ secrets.LLM_API_KEY }}
          llm_model: openai/gpt-6-luna
          pr_number: ${{ github.event.workflow_run.pull_requests[0].number || github.event.issue.number || inputs.pr_number }}
          expected_head_sha: ${{ steps.head_check.outputs.head_sha }}
      - name: Ensure PR stayed on the CI-tested head during review
        if: >-
          always() && github.event_name == 'workflow_run' &&
          steps.llm_key.outputs.skip == 'false' &&
          steps.head_check.outputs.skip == 'false' &&
          steps.cururu_review.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
          EXPECTED_HEAD_SHA: ${{ github.event.workflow_run.pull_requests[0].head.sha }}
        run: |
          if ! current_head=$(timeout 30s gh api "repos/$REPOSITORY/pulls/$PR_NUMBER" --jq .head.sha); then
            echo "::error::Could not recheck the PR head with GitHub within 30 seconds."
            exit 1
          fi
          if [ "$current_head" != "$EXPECTED_HEAD_SHA" ]; then
            echo "::error::PR head changed while Cururu was reviewing; this review does not validate the current head."
            exit 1
          fi

  blocklist-safety:
    if: github.event_name == 'pull_request_target'
    permissions:
      contents: read
      pull-requests: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - name: Validate blocklist diff without executing PR code
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import os
          import re
          import subprocess
          from pathlib import Path

          try:
              diff_result = subprocess.run(
                  ["gh", "pr", "diff", os.environ["PR_NUMBER"], "--repo", os.environ["REPOSITORY"]],
                  check=True, capture_output=True, text=True, timeout=30,
              )
          except subprocess.TimeoutExpired as error:
              raise SystemExit("Timed out fetching PR diff from GitHub after 30 seconds") from error
          except subprocess.CalledProcessError as error:
              raise SystemExit(f"gh pr diff failed with exit code {error.returncode}") from error
          diff = diff_result.stdout
          blocklist_additions = set()
          protected_additions = set()
          protected_deletions = set()
          protected_renames = []
          old_file = None
          new_file = None
          for line in diff.splitlines():
              if line.startswith("diff --git "):
                  old_path, new_path = line[len("diff --git "):].split(" b/", 1)
                  old_file = old_path.removeprefix("a/")
                  new_file = new_path
                  if old_file in {"assets/blocklist.txt", "assets/legitimate-domains.txt"} and old_file != new_file:
                      protected_renames.append(f"{old_file} -> {new_file}")
              elif line.startswith(("+++", "---")):
                  continue
              elif line.startswith("+") or line.startswith("-"):
                  value = line[1:].strip().lower()
                  if not value or value.startswith("#"):
                      continue
                  if new_file == "assets/blocklist.txt" and line.startswith("+"):
                      blocklist_additions.add(value)
                  if new_file == "assets/legitimate-domains.txt" and line.startswith("+"):
                      protected_additions.add(value)
                  if old_file == "assets/legitimate-domains.txt" and line.startswith("-"):
                      protected_deletions.add(value)

          def valid_domain(domain):
              if len(domain) > 253:
                  return False
              labels = domain.split(".")
              return len(labels) >= 2 and all(
                  0 < len(label) <= 63
                  and not label.startswith("-")
                  and not label.endswith("-")
                  and re.fullmatch(r"[a-z0-9-]+", label)
                  for label in labels
              )

          protected_path = Path("assets/legitimate-domains.txt")
          base_protected = {
              line.strip().lower()
              for line in (protected_path.read_text().splitlines() if protected_path.exists() else [])
              if line.strip() and not line.lstrip().startswith("#")
          }
          removed_protected = sorted(base_protected & protected_deletions)
          invalid_additions = sorted(domain for domain in blocklist_additions if not valid_domain(domain))
          protected_hits = sorted(blocklist_additions & (base_protected | protected_additions))
          if protected_renames or removed_protected or invalid_additions or protected_hits:
              if protected_renames:
                  print("Protected files cannot be renamed: " + ", ".join(protected_renames))
              if removed_protected:
                  print("Protected domains cannot be removed: " + ", ".join(removed_protected))
              if invalid_additions:
                  print("Malformed domains added to blocklist: " + ", ".join(invalid_additions))
              if protected_hits:
                  print("Legitimate domains added to blocklist: " + ", ".join(protected_hits))
              raise SystemExit(1)
          print(f"Validated {len(blocklist_additions)} blocklist additions against {len(base_protected)} trusted protections.")
          PY
